name: Local studio build check

on:
  push:
    branches:
      - chatgpt-local-studio-setup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check CLI MCP build
        run: cargo check -p filmcraft-cli

      - name: Build browser editor
        run: cargo xtask web
